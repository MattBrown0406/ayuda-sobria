name: AyudaSobria Zoom automation

# La Sobremesa runs every Monday at 8:00 PM Pacific. Three jobs keep it going:
#
#   Monday   10:30 PM Pacific  schedule       create next Monday's Zoom meeting (new link)
#   Thursday  3:00 PM Pacific  auto-register  re-register weekly attendees, email their link
#   Monday    4:00 PM Pacific  reminders      remind everyone registered for tonight
#
# GitHub cron only speaks UTC, so every Pacific slot is listed twice (PDT and PST).
# The job converts the current time to America/Los_Angeles and runs only when it
# matches an email slot; other runs recover/bootstrap the imminent meeting. Every
# server action is idempotent, so a manual re-run is always safe.
on:
  schedule:
    # Hourly recovery/bootstrap; idempotent. Monday 20:00–22:29 is held below.
    - cron: "30 * * * *"
    # Monday 10:30 PM Pacific = Tuesday 05:30 UTC (PDT) / 06:30 UTC (PST)
    - cron: "30 5 * * 2"
    - cron: "30 6 * * 2"
    # Thursday 3:00 PM Pacific = Thursday 22:05 UTC (PDT) / 23:05 UTC (PST)
    - cron: "5 22 * * 4"
    - cron: "5 23 * * 4"
    # Monday 4:00 PM Pacific = Monday 23:05 UTC (PDT) / Tuesday 00:05 UTC (PST)
    - cron: "5 23 * * 1"
    - cron: "5 0 * * 2"
  workflow_dispatch:
    inputs:
      action:
        description: "Which job to run now (auto = whichever slot matches the current Pacific time)"
        type: choice
        default: auto
        options:
          - auto
          - schedule
          - auto-register
          - reminders
          - followups

permissions:
  contents: read

concurrency:
  group: ayuda-zoom-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AYUDA_ZOOM_BASE_URL: ${{ secrets.AYUDA_ZOOM_BASE_URL }}
      ZOOM_AUTOMATION_SECRET: ${{ secrets.ZOOM_AUTOMATION_SECRET }}
      REQUESTED_ACTION: ${{ github.event.inputs.action || 'auto' }}
    steps:
      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [[ -z "${AYUDA_ZOOM_BASE_URL:-}" || -z "${ZOOM_AUTOMATION_SECRET:-}" ]]; then
            echo "::error::Zoom automation secrets are not configured (AYUDA_ZOOM_BASE_URL, ZOOM_AUTOMATION_SECRET). Nothing will be scheduled until they are set."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick the job for this Pacific-time slot
        id: slot
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          weekday="$(TZ=America/Los_Angeles date +%u)"   # 1 = Monday ... 7 = Sunday
          hour="$(TZ=America/Los_Angeles date +%H)"
          minute="$(TZ=America/Los_Angeles date +%M)"
          echo "Pacific time now: $(TZ=America/Los_Angeles date '+%A %H:%M %Z')"
          action="$REQUESTED_ACTION"
          if [[ "$action" == "auto" ]]; then
            if [[ "$weekday" == "1" && ( "$hour" == "20" || "$hour" == "21" || ( "$hour" == "22" && "$minute" < "30" ) ) ]]; then action="skip"
            elif [[ "$weekday" == "1" && "$hour" == "22" ]]; then action="schedule"
            elif [[ "$weekday" == "4" && "$hour" == "15" ]]; then action="auto-register"
            elif [[ "$weekday" == "1" && "$hour" == "16" ]]; then action="reminders"
            else action="schedule"
            fi
          fi
          echo "Selected job: $action"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Run La Sobremesa automation
        if: steps.config.outputs.configured == 'true' && steps.slot.outputs.action != 'skip'
        shell: bash
        env:
          ACTION: ${{ steps.slot.outputs.action }}
        run: |
          set -euo pipefail
          base_url="${AYUDA_ZOOM_BASE_URL%/}"
          auth_header="Authorization: Bearer ${ZOOM_AUTOMATION_SECRET}"

          # Creates next Monday's meeting, or returns the one that already exists.
          ensure_meeting() {
            curl --silent --show-error --fail-with-body --retry 3 --retry-delay 30 --retry-all-errors --max-time 90 \
              --request POST \
              --header "$auth_header" \
              --header "Content-Type: application/json" \
              --data '{}' \
              "$base_url/api/zoom/schedule"
          }

          post_action() {
            local payload="$1"
            echo "→ $payload"
            result="$(curl --silent --show-error --fail-with-body --retry 3 --retry-delay 30 --retry-all-errors --max-time 90 \
              --request POST \
              --header "$auth_header" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "$base_url/api/zoom/automation")"
            echo "$result"
            if ! jq -e '.ok == true' <<< "$result" >/dev/null; then
              echo "::error::Automation reported item failures; inspect stored delivery errors and rerun this action."
              failed=1
            fi
            echo
          }

          failed=0
          case "$ACTION" in
            schedule)
              # Monday night: the 8 PM meeting is over, create the next one with a new link.
              schedule_json="$(ensure_meeting)"
              echo "$schedule_json"
              echo "Next meeting: $(printf '%s' "$schedule_json" | jq -r '.occurrence.occurrenceDate') (created=$(printf '%s' "$schedule_json" | jq -r '.created'))"
              ;;
            auto-register)
              # Thursday: make sure the meeting exists (recovers a missed Monday run), then
              # register everyone who opted in and email them their personal link.
              schedule_json="$(ensure_meeting)"
              occurrence_id="$(printf '%s' "$schedule_json" | jq -er '.occurrence.id')"
              post_action "{\"action\":\"auto-register\",\"occurrenceId\":\"$occurrence_id\"}"
              post_action '{"action":"followups"}'
              ;;
            reminders)
              # Monday afternoon: catch anyone the Thursday run missed, then remind all
              # registrants that tonight's meeting is at 8 PM.
              schedule_json="$(ensure_meeting)"
              occurrence_id="$(printf '%s' "$schedule_json" | jq -er '.occurrence.id')"
              post_action "{\"action\":\"auto-register\",\"occurrenceId\":\"$occurrence_id\"}"
              post_action '{"action":"reminders"}'
              post_action '{"action":"followups"}'
              ;;
            followups)
              post_action '{"action":"followups"}'
              ;;
            *)
              echo "::error::Unknown action '$ACTION'"
              exit 1
              ;;
          esac
          if [[ "$failed" == "1" ]]; then exit 1; fi
          echo "AyudaSobria Zoom automation '$ACTION' completed."

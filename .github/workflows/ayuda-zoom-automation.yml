name: AyudaSobria Zoom automation (manual backup)

# La Sobremesa runs every Monday at 8:00 PM Pacific. Its weekly lifecycle is run by the
# database cron job `la-sobremesa-weekly-tick` (supabase/migrations/
# 20261009220000_la_sobremesa_weekly_cron.sql), which calls /api/zoom/tick every 15
# minutes; the server decides what is due in Pacific time:
#
#   Monday   10:00 PM Pacific  create next Monday's Zoom meeting (new link)
#   Thursday  3:00 PM Pacific  auto-register weekly attendees, email their link
#   Monday    4:00 PM Pacific  remind everyone registered for tonight
#   Tuesday  10:00 AM Pacific  weekly attendance report
#
# GitHub's own cron was unreliable (hourly runs often arrived hours late) and its
# secrets were never configured, so this workflow is now manual-only. It needs the
# repository secrets AYUDA_ZOOM_BASE_URL (https://ayudasobria.com) and
# ZOOM_AUTOMATION_SECRET (same value as the site's server secret). Every server action
# is idempotent, so a manual run is always safe.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Which job to run now (tick = whatever is due at the current Pacific time)"
        type: choice
        default: tick
        options:
          - tick
          - schedule
          - auto-register
          - reminders
          - followups

permissions:
  contents: read

concurrency:
  group: ayuda-zoom-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AYUDA_ZOOM_BASE_URL: ${{ secrets.AYUDA_ZOOM_BASE_URL }}
      ZOOM_AUTOMATION_SECRET: ${{ secrets.ZOOM_AUTOMATION_SECRET }}
      REQUESTED_ACTION: ${{ github.event.inputs.action || 'tick' }}
    steps:
      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [[ -z "${AYUDA_ZOOM_BASE_URL:-}" || -z "${ZOOM_AUTOMATION_SECRET:-}" ]]; then
            echo "::error::Zoom automation secrets are not configured (AYUDA_ZOOM_BASE_URL, ZOOM_AUTOMATION_SECRET). Nothing will be scheduled until they are set."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick the job
        id: slot
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          echo "Pacific time now: $(TZ=America/Los_Angeles date '+%A %H:%M %Z')"
          echo "Selected job: $REQUESTED_ACTION"
          echo "action=$REQUESTED_ACTION" >> "$GITHUB_OUTPUT"

      - name: Run La Sobremesa automation
        if: steps.config.outputs.configured == 'true' && steps.slot.outputs.action != 'skip'
        shell: bash
        env:
          ACTION: ${{ steps.slot.outputs.action }}
        run: |
          set -euo pipefail
          base_url="${AYUDA_ZOOM_BASE_URL%/}"
          auth_header="Authorization: Bearer ${ZOOM_AUTOMATION_SECRET}"

          # Creates next Monday's meeting, or returns the one that already exists.
          ensure_meeting() {
            curl --silent --show-error --fail-with-body --retry 3 --retry-delay 30 --retry-all-errors --max-time 90 \
              --request POST \
              --header "$auth_header" \
              --header "Content-Type: application/json" \
              --data '{}' \
              "$base_url/api/zoom/schedule"
          }

          post_action() {
            local payload="$1"
            echo "→ $payload"
            result="$(curl --silent --show-error --fail-with-body --retry 3 --retry-delay 30 --retry-all-errors --max-time 90 \
              --request POST \
              --header "$auth_header" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "$base_url/api/zoom/automation")"
            echo "$result"
            if ! jq -e '.ok == true' <<< "$result" >/dev/null; then
              echo "::error::Automation reported item failures; inspect stored delivery errors and rerun this action."
              failed=1
            fi
            echo
          }

          failed=0
          case "$ACTION" in
            tick)
              result="$(curl --silent --show-error --fail-with-body --retry 3 --retry-delay 30 --retry-all-errors --max-time 120 \
                --request POST \
                --header "$auth_header" \
                --header "Content-Type: application/json" \
                --data '{"source":"github"}' \
                "$base_url/api/zoom/tick")"
              echo "$result"
              if ! jq -e '.ok == true' <<< "$result" >/dev/null; then
                echo "::error::The tick reported errors; see .errors above."
                failed=1
              fi
              ;;
            schedule)
              # Create (or confirm) the meeting for the coming Monday.
              schedule_json="$(ensure_meeting)"
              echo "$schedule_json"
              echo "Next meeting: $(printf '%s' "$schedule_json" | jq -r '.occurrence.occurrenceDate') (created=$(printf '%s' "$schedule_json" | jq -r '.created'))"
              ;;
            auto-register)
              # Thursday: make sure the meeting exists (recovers a missed Monday run), then
              # register everyone who opted in and email them their personal link.
              schedule_json="$(ensure_meeting)"
              occurrence_id="$(printf '%s' "$schedule_json" | jq -er '.occurrence.id')"
              post_action "{\"action\":\"auto-register\",\"occurrenceId\":\"$occurrence_id\"}"
              post_action '{"action":"followups"}'
              ;;
            reminders)
              # Monday afternoon: catch anyone the Thursday run missed, then remind all
              # registrants that tonight's meeting is at 8 PM.
              schedule_json="$(ensure_meeting)"
              occurrence_id="$(printf '%s' "$schedule_json" | jq -er '.occurrence.id')"
              post_action "{\"action\":\"auto-register\",\"occurrenceId\":\"$occurrence_id\"}"
              post_action '{"action":"reminders"}'
              post_action '{"action":"followups"}'
              ;;
            followups)
              post_action '{"action":"followups"}'
              ;;
            *)
              echo "::error::Unknown action '$ACTION'"
              exit 1
              ;;
          esac
          if [[ "$failed" == "1" ]]; then exit 1; fi
          echo "AyudaSobria Zoom automation '$ACTION' completed."
